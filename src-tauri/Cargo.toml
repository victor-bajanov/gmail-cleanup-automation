[package]
name = "gmail-cleanup-gui"
version = "0.1.0"
description = "A Tauri GUI for Gmail Cleanup"
authors = ["you"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Core Tauri
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# Link to main library
gmail-automation = { path = ".." }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# State management
parking_lot = "0.12"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Platform paths
dirs = "5"

# TLS (for crypto provider initialization)
[target.'cfg(not(windows))'.dependencies]
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }

[target.'cfg(windows)'.dependencies]
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
